[project]
name = "dispatchr"
version = "0.1.0"
description = "Automation & background jobs platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "pydantic",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "redis",
    "rq",
    "httpx",
    "asyncpg",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
