name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Debug versions
        run: |
          python --version
          pip --version
          ruff --version
          pytest --version

      - name: Ruff (lint)
        run: |
          cd backend
          ruff check .

      - name: Ruff (format check)
        run: |
          cd backend
          ruff format --check .

      - name: Pytest
        run: |
          cd backend
          pytest -q
